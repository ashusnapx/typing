apiVersion: apps/v1
kind: Deployment
metadata:
  name: mathsmania-frontend
  namespace: mathsmania
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mathsmania-frontend
  template:
    metadata:
      labels:
        app: mathsmania-frontend
    spec:
      containers:
      - name: frontend
        image: mathsmania/frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "https://api.mathsmania.com/api/v1"
        - name: NEXT_PUBLIC_WS_URL
          value: "wss://ws.mathsmania.com"
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mathsmania-frontend
  namespace: mathsmania
spec:
  selector:
    app: mathsmania-frontend
  ports:
  - port: 80
    targetPort: 3000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mathsmania-frontend-hpa
  namespace: mathsmania
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mathsmania-frontend
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
