name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  id-token: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}
  NODE_VERSION: "20"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # SECURITY SCAN — secrets, IaC, deps
  # ─────────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Gitleaks — secrets scanning
        uses: gitleaks/gitleaks-action@v3
        continue-on-error: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend

      - name: npm audit — dependency vulnerabilities
        run: npm audit --audit-level=high || true
        working-directory: frontend
        continue-on-error: true

      - name: Trivy — filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          skip-dirs: node_modules,.next,venv,__pycache__,migrations

      - name: Upload Trivy SARIF
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f trivy-results.sarif ] && [ -s trivy-results.sarif ]; then
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              /repos/${{ github.repository }}/code-scanning/sarifs \
              -f commit_sha="${{ github.sha }}" \
              -f ref="${{ github.ref }}" \
              -f sarif="@trivy-results.sarif" \
              -f category="trivy" || echo "SARIF upload skipped"
          fi

  # ─────────────────────────────────────────────────────────────────────────────
  # FRONTEND QUALITY — lint, typecheck, test, build
  # ─────────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Lint → Typecheck → Test → Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [security-scan]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Lint (ESLint)
        run: npm run lint
        working-directory: frontend

      - name: Typecheck (TypeScript)
        run: npm run typecheck
        working-directory: frontend

      - name: Test (Vitest)
        run: npm run test
        working-directory: frontend

      - name: Build (Next.js)
        run: npm run build
        working-directory: frontend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/typing_test
          REDIS_URL: redis://localhost:6379/0
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key

  # ─────────────────────────────────────────────────────────────────────────────
  # BUILD & PUSH — main only, Docker images + Cosign signing
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: frontend-build
        name: Build & push frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://test.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=test-anon-key
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=test-publishable-key
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/frontend:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign frontend image
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ github.repository }}/frontend@${{ steps.frontend-build.outputs.digest }}

  # ─────────────────────────────────────────────────────────────────────────────
  # DEPLOY — main only, Kubernetes
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5

      - name: Deploy to Kubernetes
        shell: bash
        run: |
          if ! kubectl config current-context &>/dev/null; then
            echo "No Kubernetes cluster configured — skipping deploy"
            exit 0
          fi
          kubectl set image deployment/mathsmania-frontend \
            frontend=${{ env.REGISTRY }}/${{ github.repository }}/frontend:${{ env.IMAGE_TAG }}
          kubectl rollout status deployment/mathsmania-frontend --timeout=300s
