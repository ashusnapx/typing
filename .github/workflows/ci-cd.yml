name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks - Secrets Scanning
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: false

      - name: Checkov - IaC Scanning
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          skip_check: CKV_DOCKER_2,CKV_DOCKER_3,CKV_DOCKER_7
          soft_fail: false

      - name: Dependency audit - Python
        run: |
          cd backend
          pip install pip-audit
          pip-audit --desc on --strict

      - name: Dependency audit - Node
        run: |
          cd frontend
          npm audit --audit-level=high

      - name: Trivy - Container image scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: 1

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  test-backend:
    runs-on: ubuntu-latest
    needs: [security-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install flake8 mypy bandit

      - name: Run linter
        run: |
          cd backend
          flake8 app/ --max-line-length=120 --select=E,F,W,C

      - name: Type check
        run: |
          cd backend
          mypy app/ --ignore-missing-imports

      - name: SAST - Bandit
        run: |
          cd backend
          bandit -r app/ -ll -f sarif -o bandit-results.sarif || true

      - name: Bandit results
        uses: actions/upload-artifact@v4
        with:
          name: bandit-results
          path: backend/bandit-results.sarif

  test-frontend:
    runs-on: ubuntu-latest
    needs: [security-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run linter
        run: |
          cd frontend
          npm run lint

      - name: Type check
        run: |
          cd frontend
          npm run typecheck

  build-and-push:
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }},${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }},${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Image signing with Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign frontend image
        run: |
          cosign sign --yes ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Sign backend image
        run: |
          cosign sign --yes ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

  deploy:
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

      - name: Apply security manifests
        run: |
          kubectl apply -f k8s/security-context.yaml --server-side

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/mathsmania-frontend \
            mathsmania-frontend=${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            -n mathsmania
          kubectl set image deployment/mathsmania-backend \
            mathsmania-backend=${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            -n mathsmania
          kubectl rollout status deployment/mathsmania-frontend -n mathsmania
          kubectl rollout status deployment/mathsmania-backend -n mathsmania
