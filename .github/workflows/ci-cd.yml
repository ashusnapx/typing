name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  id-token: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # STAGE 1: SECURITY SCAN (secrets, IaC, deps, filesystem scan)
  # ───────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Gitleaks — secrets scanning
        uses: gitleaks/gitleaks-action@v3
        continue-on-error: true

      - name: Checkov — IaC security scanning
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          skip_check: CKV_DOCKER_2,CKV_DOCKER_3,CKV_DOCKER_7
          quiet: true
          soft_fail: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend

      - name: npm audit — Node dependency vulnerabilities
        run: npm audit --audit-level=high || true
        working-directory: frontend
        continue-on-error: true

      - name: Trivy — filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1
          skip-dirs: node_modules,.next,venv,__pycache__,migrations

      - name: Upload Trivy SARIF to Security tab
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f trivy-results.sarif ] && [ -s trivy-results.sarif ]; then
            echo "Uploading SARIF results..."
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              /repos/${{ github.repository }}/code-scanning/sarifs \
              -f commit_sha="${{ github.sha }}" \
              -f ref="${{ github.ref }}" \
              -f sarif="@trivy-results.sarif" \
              -f category="trivy" || echo "SARIF upload skipped (not critical)"
          else
            echo "No SARIF results generated — scan found no issues"
          fi

  # ───────────────────────────────────────────────────────────────────────────
  # STAGE 2: FRONTEND QUALITY (lint, typecheck, build)
  # ───────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [security-scan]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Lint — ESLint
        run: npm run lint
        working-directory: frontend

      - name: Type check — TypeScript
        run: npm run typecheck
        working-directory: frontend

      - name: Build — Next.js
        run: npm run build
        working-directory: frontend
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/typing_test
          REDIS_URL: redis://localhost:6379/0
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key

  # ───────────────────────────────────────────────────────────────────────────
  # STAGE 3: BUILD & PUSH (main only — Docker image + Cosign signing)
  # ───────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: frontend-build
        name: Build & push frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://test.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=test-anon-key
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=test-publishable-key
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/frontend:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign frontend image
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ github.repository }}/frontend@${{ steps.frontend-build.outputs.digest }}

  # ───────────────────────────────────────────────────────────────────────────
  # STAGE 4: DEPLOY (main only — Kubernetes, soft-fail if no cluster)
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5

      - name: Deploy to Kubernetes
        shell: bash
        run: |
          # Check if a K8s cluster is configured
          if ! kubectl config current-context &>/dev/null; then
            echo "No Kubernetes cluster configured — skipping deploy"
            exit 0
          fi

          # Apply security context if it exists
          if [ -f infrastructure/k8s/security-context.yaml ]; then
            kubectl apply -f infrastructure/k8s/security-context.yaml
          else
            echo "security-context.yaml not found — skipping"
          fi

          # Deploy frontend
          kubectl set image deployment/mathsmania-frontend \
            frontend=${{ env.REGISTRY }}/${{ github.repository }}/frontend:${{ env.IMAGE_TAG }}
          kubectl rollout status deployment/mathsmania-frontend --timeout=300s
