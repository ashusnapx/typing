apiVersion: v1
kind: Namespace
metadata:
  name: mathsmania
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mathsmania-config
  namespace: mathsmania
data:
  APP_NAME: "Maths Mania"
  REDIS_URL: "redis://redis-cluster:6379/0"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-cluster:9092"
  CORS_ORIGINS: "https://mathsmania.com,https://www.mathsmania.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: mathsmania-secrets
  namespace: mathsmania
type: Opaque
stringData:
  database-url: "postgresql+asyncpg://postgres:${DB_PASSWORD}@postgres-primary:5432/mathsmania"
  jwt-secret: "${JWT_SECRET}"
  r2-access-key: "${R2_ACCESS_KEY}"
  r2-secret-key: "${R2_SECRET_KEY}"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mathsmania-ingress
  namespace: mathsmania
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
spec:
  rules:
  - host: mathsmania.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mathsmania-frontend
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: mathsmania-backend
            port:
              number: 80
  - host: api.mathsmania.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mathsmania-backend
            port:
              number: 80
  tls:
  - hosts:
    - mathsmania.com
    - api.mathsmania.com
    secretName: mathsmania-tls
