apiVersion: apps/v1
kind: Deployment
metadata:
  name: mathsmania-backend
  namespace: mathsmania
spec:
  replicas: 5
  selector:
    matchLabels:
      app: mathsmania-backend
  template:
    metadata:
      labels:
        app: mathsmania-backend
    spec:
      containers:
      - name: backend
        image: mathsmania/backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: mathsmania-secrets
              key: database-url
        - name: REDIS_URL
          value: "redis://redis-cluster:6379/0"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: mathsmania-secrets
              key: jwt-secret
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mathsmania-backend
  namespace: mathsmania
spec:
  selector:
    app: mathsmania-backend
  ports:
  - port: 80
    targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mathsmania-backend-hpa
  namespace: mathsmania
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mathsmania-backend
  minReplicas: 5
  maxReplicas: 50
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
