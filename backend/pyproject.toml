[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*", "Test*"]
markers = [
    "loadtest: marks tests as load tests (skipped by default)",
    "slow: marks tests as slow (skipped by default)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore:::passlib",
]
addopts = "-v --tb=short"

[tool.flake8]
max-line-length = 120
max-complexity = 10
extend-ignore = [
    "E203",   # whitespace before ':' (black compat)
    "E266",   # too many leading '#' for block comment
    "W503",   # line break before binary operator
    "W504",   # line break after binary operator
    "E501",   # line too long (handled by black)
    "F401",   # imported but unused (mypy handles this)
    "F403",   # wildcard imports
    "F405",   # undefined from wildcard
]
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".env",
    "migrations/versions",
    "node_modules",
]
per-file-ignores = [
    "__init__.py: F401",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_any_unimported = false
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true
exclude = [
    "migrations/",
    ".env",
]
namespace_packages = true

[[tool.mypy.overrides]]
module = [
    "app.main",
    "app.config",
]
disallow_untyped_defs = false

[tool.bandit]
exclude_dirs = [
    "venv",
    ".env",
    "tests",
    "migrations",
]
tests = [
    "B101",  # assert_used
    "B102",  # exec_used
    "B103",  # set_bad_file_permissions
    "B104",  # hardcoded_bind_all_interfaces
    "B105",  # hardcoded_password_string
    "B106",  # hardcoded_password_funcarg
    "B107",  # hardcoded_password_default
    "B108",  # hardcoded_tmp_directory
    "B110",  # try_except_pass
    "B112",  # try_except_continue
    "B201",  # flask_debug_true
    "B301",  # pickle
    "B302",  # marshal
    "B303",  # md5
    "B304",  # ciphers
    "B305",  # cipher_modes
    "B306",  # mktemp_q
    "B307",  # eval
    "B308",  # mark_safe
    "B309",  # httpsconnection
    "B310",  # urllib_urlopen
    "B311",  # random
    "B312",  # telnetlib
    "B313",  # xml_bad_cElementTree
    "B314",  # xml_bad_ElementTree
    "B315",  # xml_bad_etree
    "B316",  # xml_bad_minidom
    "B317",  # xml_bad_pulldom
    "B318",  # xml_bad_sax
    "B319",  # xml_bad_expatreader
    "B320",  # xml_bad_xmltodict
    "B321",  # ftplib
    "B323",  # unverified_context
    "B324",  # hashlib_new_insecure_functions
    "B325",  # temp_file
    "B401",  # import_telnetlib
    "B402",  # import_ftplib
    "B403",  # import_pickle
    "B404",  # import_subprocess
    "B405",  # start_process_with_no_shell
    "B406",  # start_process_with_partial_path
    "B407",  # start_process_with_no_shell
    "B408",  # start_process_with_shell
    "B409",  # start_process_with_pipe
    "B410",  # import_lxml
    "B411",  # import_xml_lib
    "B412",  # import_http_client
    "B413",  # import_pycrypto
    "B415",  # import_ipaddress
    "B501",  # request_with_no_cert_validation
    "B502",  # ssl_with_no_version
    "B503",  # ssl_with_bad_version
    "B504",  # ssl_with_no_ssl_context
    "B505",  # weak_cryptographic_key
    "B601",  # paramiko_calls
    "B602",  # subprocess_popen_with_shell_equals_true
    "B603",  # subprocess_without_shell_equals_true
    "B604",  # any_other_function_with_shell_equals_true
    "B605",  # start_process_with_a_shell
    "B606",  # start_process_with_no_shell
    "B607",  # start_process_with_partial_path
    "B608",  # hardcoded_sql_expressions
    "B609",  # linux_commands_wildcard_injection
    "B610",  # django_extra_used
    "B611",  # django_rawsql_used
    "B701",  # jinja2_autoescape_false
]
skips = [
    "B101",  # Allow asserts in tests
    "B404",  # Allow subprocess import with warning
    "B603",  # Allow subprocess with proper validation
    "B607",  # Allow subprocess with proper path
]
