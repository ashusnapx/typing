apiVersion: apps/v1
kind: Deployment
metadata:
  name: mathsmania-frontend
  namespace: mathsmania
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mathsmania-frontend
  template:
    metadata:
      labels:
        app: mathsmania-frontend
    spec:
      containers:
      - name: frontend
        image: mathsmania/frontend:latest
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: mathsmania-secrets
              key: database-url
        - name: REDIS_URL
          value: "redis://redis-cluster:6379/0"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: mathsmania-secrets
              key: jwt-secret
        - name: PORT
          value: "3000"
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mathsmania-frontend
  namespace: mathsmania
spec:
  selector:
    app: mathsmania-frontend
  ports:
  - port: 80
    targetPort: 3000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mathsmania-frontend-hpa
  namespace: mathsmania
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mathsmania-frontend
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
