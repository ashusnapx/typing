apiVersion: apps/v1
kind: Deployment
metadata:
  name: mathsmania-frontend
  namespace: mathsmania
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mathsmania-frontend
  template:
    metadata:
      labels:
        app: mathsmania-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mathsmania-frontend
          image: ghcr.io/anomalyco/typing/frontend:latest
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mathsmania-secrets
                  key: database-url
            - name: REDIS_URL
              value: "redis://redis-cluster:6379/0"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mathsmania-secrets
                  key: jwt-secret
            - name: PORT
              value: "3000"
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Namespace
metadata:
  name: mathsmania
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: mathsmania
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-ingress
  namespace: mathsmania
spec:
  podSelector:
    matchLabels:
      app: mathsmania-frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 3000
