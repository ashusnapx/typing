name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  id-token: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # STAGE 1: SECURITY SCAN (fastest-fail — secrets, IaC, deps, vulns)
  # ───────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Gitleaks — secrets scanning
        uses: gitleaks/gitleaks-action@v3

      - name: Checkov — IaC security scanning
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          skip_check: CKV_DOCKER_2,CKV_DOCKER_3,CKV_DOCKER_7
          quiet: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-test.txt

      - name: pip-audit — Python dependency vulnerabilities
        run: pip-audit
        continue-on-error: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend

      - name: npm audit — Node dependency vulnerabilities
        run: npm audit --audit-level=high || true
        working-directory: frontend
        continue-on-error: true

      - name: Trivy — install
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.58.2
          trivy --version

      - name: Trivy — filesystem vulnerability scan
        continue-on-error: true
        run: |
          trivy fs --format sarif --output trivy-results.sarif \
            --severity CRITICAL,HIGH --exit-code 1 \
            --skip-dirs node_modules,.next,venv,__pycache__,migrations \
            . || true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy
        continue-on-error: true

  # ───────────────────────────────────────────────────────────────────────────
  # STAGE 2: BACKEND QUALITY (lint, typecheck, SAST, test)
  # ───────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [security-scan]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: typing_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-test.txt

      - name: Lint — flake8
        run: python -m flake8 app --count --statistics
        working-directory: backend

      - name: Type check — mypy
        run: python -m mypy app --ignore-missing-imports
        working-directory: backend
        continue-on-error: true

      - name: SAST — bandit
        run: python -m bandit -r app -ll
        working-directory: backend
        continue-on-error: true

      - name: Test — pytest
        run: python -m pytest tests -v --tb=short -x
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/typing_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: test-secret-key-thats-at-least-32-chars-long-for-ci
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_SERVICE_KEY: test-service-key
        continue-on-error: true

  # ───────────────────────────────────────────────────────────────────────────
  # STAGE 3: FRONTEND QUALITY (lint, typecheck, build)
  # ───────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [security-scan]
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend

      - name: Lint — ESLint
        run: npm run lint
        working-directory: frontend

      - name: Type check — TypeScript
        run: npm run typecheck
        working-directory: frontend

      - name: Build — Next.js
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
        continue-on-error: true

  # ───────────────────────────────────────────────────────────────────────────
  # STAGE 4: BUILD & PUSH (main only — Docker images + Cosign signing)
  # ───────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: backend-build
        name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/backend:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: frontend-build
        name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/frontend:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign backend image
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ github.repository }}/backend@${{ steps.backend-build.outputs.digest }}

      - name: Sign frontend image
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ github.repository }}/frontend@${{ steps.frontend-build.outputs.digest }}

  # ───────────────────────────────────────────────────────────────────────────
  # STAGE 5: DEPLOY (main only — Kubernetes)
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v5

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Apply security context
        run: kubectl apply -f infrastructure/k8s/security-context.yaml
        continue-on-error: true

      - name: Deploy backend
        run: |
          kubectl set image deployment/backend \
            backend=${{ env.REGISTRY }}/${{ github.repository }}/backend:${{ env.IMAGE_TAG }}
          kubectl rollout status deployment/backend --timeout=300s

      - name: Deploy frontend
        run: |
          kubectl set image deployment/frontend \
            frontend=${{ env.REGISTRY }}/${{ github.repository }}/frontend:${{ env.IMAGE_TAG }}
          kubectl rollout status deployment/frontend --timeout=300s
